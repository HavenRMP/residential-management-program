version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/services"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"
    # Angular, su CLI, el builder de variables de entorno y TypeScript deben subir juntos y de a una versión mayor
    # (con ng update). Dependabot solo propone minor y patch agrupados; las mayores van por la tarea de migración.
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@ngx-env/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ngx-env/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: "pub"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "permission_handler"
        versions: [">= 12.0.0"]
      - dependency-name: "google_fonts"
        versions: [">= 9.0.0"]