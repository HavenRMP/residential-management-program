name: Google Play Deploy (Manual)

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
        - internal
        - alpha
        - beta
        - production

jobs:
  build-and-deploy:
    name: Build & Deploy to Google Play
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Firebase Configs from secrets
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/firebase_options.dart
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          echo "${{ secrets.FIREBASE_JSON_BASE64 }}" | base64 --decode > firebase.json

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "API_BASE_URL_USUARIOS=${{ secrets.API_BASE_URL_USUARIOS }}" >> .env
          echo "API_BASE_URL_VIVIENDAS=${{ secrets.API_BASE_URL_VIVIENDAS }}" >> .env

      - name: Create keystore from secret
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Build Android AppBundle
        run: flutter build appbundle --release

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
          packageName: com.haven.uaq
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: completed

      - name: Notify Discord on Deploy
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TRACK="${{ github.event.inputs.track }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="🚀"
            COLOR="65280"
            MSG="Deploy completado exitosamente en Google Play ($TRACK) y listo para ser probado."
          else
            EMOJI="❌"
            COLOR="16711680"
            MSG="Falló el deploy en Google Play ($TRACK)."
          fi
          
          curl -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"$EMOJI CI/CD: Google Play Deploy $STATUS\",
              \"description\": \"$MSG\n\nAtentamente: Teto Automatomation Bot\",
              \"color\": $COLOR
            }]
          }" \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"
