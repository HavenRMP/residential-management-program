name: Flutter CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'mobile/**'
  pull_request:
    branches:
      - '**'
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  test:
    name: Unit and Widget Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'
          cache: false

      - name: Create Firebase Configs from secrets
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/firebase_options.dart
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          echo "${{ secrets.FIREBASE_JSON_BASE64 }}" | base64 --decode > firebase.json

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "API_BASE_URL_USUARIOS=${{ secrets.API_BASE_URL_USUARIOS }}" >> .env
          echo "API_BASE_URL_VIVIENDAS=${{ secrets.API_BASE_URL_VIVIENDAS }}" >> .env
          echo "API_BASE_URL_AVISOS=${{ secrets.API_BASE_URL_AVISOS }}" >> .env
          echo "API_BASE_URL_CONDOMINIOS=${{ secrets.API_BASE_URL_CONDOMINIOS }}" >> .env
          echo "API_BASE_URL_VISITAS=${{ secrets.API_BASE_URL_VISITAS || 'https://visitas-api-r66s.onrender.com' }}" >> .env
          echo "API_BASE_URL_PAQUETERIA=${{ secrets.API_BASE_URL_PAQUETERIA || secrets.API_BASE_URL_VISITAS || 'https://visitas-api-r66s.onrender.com' }}" >> .env
          echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> .env
          echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> .env
          echo "ADMIN_USER_EMAIL=${{ secrets.ADMIN_USER_EMAIL }}" >> .env
          echo "ADMIN_USER_PASSWORD=${{ secrets.ADMIN_USER_PASSWORD }}" >> .env

      - name: Analyze code
        run: |
          mkdir -p logs
          flutter analyze --no-fatal-warnings 2>&1 | tee logs/analyze.log

      - name: Run unit and widget tests
        run: |
          mkdir -p logs reports
          flutter test --file-reporter json:reports/tests.json 2>&1 | tee logs/tests.log

      - name: Notify Discord on Success/Failure
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          python3 -c "
          import json, os, urllib.request, datetime, re

          status = os.environ.get('JOB_STATUS', 'unknown').lower()
          is_success = (status == 'success')
          emoji = '✅' if is_success else '❌'
          color = 65280 if is_success else 16711680

          repo = '${{ github.repository }}'
          ref = '${{ github.ref_name }}'
          sha = '${{ github.sha }}'
          short_sha = sha[:7] if sha else ''
          actor = '${{ github.actor }}'
          event = '${{ github.event_name }}'
          run_id = '${{ github.run_id }}'
          run_url = f'https://github.com/{repo}/actions/runs/{run_id}'
          commit_url = f'https://github.com/{repo}/commit/{sha}'
          commit_msg = '''$COMMIT_MSG'''.strip()

          webhook_url = os.environ.get('DISCORD_WEBHOOK_URL', '')
          if not webhook_url:
              print('No DISCORD_WEBHOOK_URL provided, skipping.')
              exit(0)

          tests, errors, failed = {}, {}, []
          passed, skipped = 0, 0

          if os.path.exists('reports/tests.json'):
              try:
                  with open('reports/tests.json', 'r', encoding='utf-8') as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          try:
                              ev = json.loads(line)
                              t_type = ev.get('type')
                              if t_type == 'testStart':
                                  t = ev.get('test', {})
                                  name = t.get('name', '')
                                  if not name.startswith('loading '):
                                      tests[t['id']] = t
                              elif t_type == 'error':
                                  tid = ev.get('testID')
                                  err = ev.get('error', '').strip()
                                  if err:
                                      errors.setdefault(tid, []).append(err)
                              elif t_type == 'testDone':
                                  tid = ev.get('testID')
                                  if tid in tests:
                                      if ev.get('skipped'):
                                          skipped += 1
                                      elif ev.get('result') == 'success':
                                          passed += 1
                                      elif ev.get('result') in ('failure', 'error'):
                                          t_info = tests[tid]
                                          err_msg = '\n'.join(errors.get(tid, []))
                                          failed.append({
                                              'name': t_info.get('name', 'Unknown'),
                                              'url': t_info.get('url', ''),
                                              'line': t_info.get('line'),
                                              'error': err_msg
                                          })
                          except Exception:
                              pass
              except Exception as e:
                  print(f'Error reading tests.json: {e}')

          total = passed + len(failed) + skipped

          if is_success:
              test_summary = f'✅ **{passed}** pasados de **{total or passed}** tests (100% efectividad)'
          else:
              test_summary = f'❌ **{len(failed)}** fallados | ✅ **{passed}** pasados | ⏭️ **{skipped}** omitidos (Total: **{total}**)'

          fields = [
              {'name': '🌿 Rama', 'value': f'\`{ref}\`', 'inline': True},
              {'name': '👤 Autor', 'value': f'\`{actor}\`', 'inline': True},
              {'name': '⚡ Evento', 'value': f'\`{event}\`', 'inline': True},
              {'name': '📝 Commit', 'value': f'[{short_sha}]({commit_url})', 'inline': True},
              {'name': '🚀 Estado CI', 'value': f'**{status.upper()}**', 'inline': True},
              {'name': '📱 Módulo', 'value': '\`mobile (Flutter)\`', 'inline': True},
              {'name': '📊 Resumen de Tests', 'value': test_summary, 'inline': False},
          ]

          if failed:
              failed_list_lines = []
              for item in failed[:5]:
                  fname = item['url'].split('/')[-1] if item['url'] else ''
                  loc = f' (\`{fname}:{item[\"line\"]}\`)' if fname and item['line'] else (f' (\`{fname}\`)' if fname else '')
                  failed_list_lines.append(f'• ❌ **{item[\"name\"]}**{loc}')
              if len(failed) > 5:
                  failed_list_lines.append(f'*(y {len(failed) - 5} fallos adicionales...)*')
              fields.append({
                  'name': f'🚨 Tests Fallidos ({len(failed)})',
                  'value': '\n'.join(failed_list_lines)[:1000],
                  'inline': False
              })

              first_err = failed[0].get('error', '').strip()
              if first_err:
                  clean_err = first_err[:900]
                  fields.append({
                      'name': '💥 Diagnóstico del Error / Falla',
                      'value': f'\`\`\`text\n{clean_err}\n\`\`\`',
                      'inline': False
                  })
          elif not is_success:
              analysis_errors = []
              if os.path.exists('logs/analyze.log'):
                  with open('logs/analyze.log', 'r', encoding='utf-8', errors='ignore') as f:
                      for l in f:
                          if 'error •' in l or 'error -' in l:
                              analysis_errors.append(l.strip())
              if analysis_errors:
                  fields.append({
                      'name': '🚨 Errores de Análisis Estático (flutter analyze)',
                      'value': f'\`\`\`text\n' + '\n'.join(analysis_errors[:8])[:900] + '\n\`\`\`',
                      'inline': False
                  })
              elif os.path.exists('logs/tests.log'):
                  with open('logs/tests.log', 'r', encoding='utf-8', errors='ignore') as f:
                      tail = f.readlines()[-15:]
                  clean_tail = ''.join(tail).strip()[:900]
                  if clean_tail:
                      fields.append({
                          'name': '🚨 Salida de Fallo en Consola',
                          'value': f'\`\`\`text\n{clean_tail}\n\`\`\`',
                          'inline': False
                      })

          fields.extend([
              {'name': '💬 Mensaje del Commit', 'value': commit_msg[:250] if commit_msg else 'Sin mensaje', 'inline': False},
              {'name': '🔗 Logs & Diagnóstico', 'value': f'[Ver ejecución completa en GitHub Actions]({run_url})', 'inline': False},
          ])

          title = (
              f'✅ Flutter CI: Todos los Tests Pasaron ({passed}/{total or passed})'
              if is_success else
              f'❌ Flutter CI: Fallaron {len(failed) or 1} Prueba(s)'
          )

          payload = {
              'embeds': [{
                  'title': title,
                  'url': run_url,
                  'description': f'Flujo de validación unitaria y de widgets en **{repo}**.',
                  'color': color,
                  'fields': fields,
                  'footer': {
                      'text': 'Haven CI/CD • Flutter Test Suite',
                      'icon_url': 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'
                  },
                  'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat()
              }]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json', 'User-Agent': 'Haven-CI-Bot'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f'Notificación enviada a Discord exitosamente: {resp.status}')
          except Exception as e:
              print(f'Error enviando notificación a Discord: {e}')
          "

  integration_test_linux:
    name: Linux Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'
          cache: false

      - name: Create Firebase Configs from secrets
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/firebase_options.dart
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          echo "${{ secrets.FIREBASE_JSON_BASE64 }}" | base64 --decode > firebase.json

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "API_BASE_URL_USUARIOS=${{ secrets.API_BASE_URL_USUARIOS }}" >> .env
          echo "API_BASE_URL_VIVIENDAS=${{ secrets.API_BASE_URL_VIVIENDAS }}" >> .env
          echo "API_BASE_URL_AVISOS=${{ secrets.API_BASE_URL_AVISOS }}" >> .env
          echo "API_BASE_URL_CONDOMINIOS=${{ secrets.API_BASE_URL_CONDOMINIOS }}" >> .env
          echo "API_BASE_URL_VISITAS=${{ secrets.API_BASE_URL_VISITAS || 'https://visitas-api-r66s.onrender.com' }}" >> .env
          echo "API_BASE_URL_PAQUETERIA=${{ secrets.API_BASE_URL_PAQUETERIA || secrets.API_BASE_URL_VISITAS || 'https://visitas-api-r66s.onrender.com' }}" >> .env
          echo "TEST_USER_EMAIL=${{ secrets.TEST_USER_EMAIL }}" >> .env
          echo "TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}" >> .env
          echo "ADMIN_USER_EMAIL=${{ secrets.ADMIN_USER_EMAIL }}" >> .env
          echo "ADMIN_USER_PASSWORD=${{ secrets.ADMIN_USER_PASSWORD }}" >> .env

      - name: Setup Linux Desktop for testing
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
          flutter config --enable-linux-desktop

      - name: Run Linux integration tests
        run: |
          mkdir -p logs
          xvfb-run flutter test integration_test/app_test.dart -d linux 2>&1 | tee logs/e2e.log

      - name: Notify Discord on Integration Test
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          python3 -c "
          import json, os, urllib.request, datetime, re

          status = os.environ.get('JOB_STATUS', 'unknown').lower()
          is_success = (status == 'success')
          emoji = '✅' if is_success else '❌'
          color = 65280 if is_success else 16711680

          repo = '${{ github.repository }}'
          ref = '${{ github.ref_name }}'
          sha = '${{ github.sha }}'
          short_sha = sha[:7] if sha else ''
          actor = '${{ github.actor }}'
          event = '${{ github.event_name }}'
          run_id = '${{ github.run_id }}'
          run_url = f'https://github.com/{repo}/actions/runs/{run_id}'
          commit_url = f'https://github.com/{repo}/commit/{sha}'
          commit_msg = '''$COMMIT_MSG'''.strip()

          webhook_url = os.environ.get('DISCORD_WEBHOOK_URL', '')
          if not webhook_url:
              print('No DISCORD_WEBHOOK_URL provided, skipping.')
              exit(0)

          failure_details = ''
          if not is_success and os.path.exists('logs/e2e.log'):
              try:
                  with open('logs/e2e.log', 'r', encoding='utf-8', errors='ignore') as f:
                      lines = f.readlines()
                  
                  # Buscar fragmentos de error relevantes
                  relevant = []
                  capturing = False
                  for line in lines:
                      if any(k in line for k in ['EXCEPTION CAUGHT', 'Test failed', 'Expected:', '══╡']):
                          capturing = True
                      if capturing:
                          relevant.append(line)
                          if len(relevant) >= 20:
                              break
                  if not relevant:
                      relevant = lines[-15:]
                  failure_details = ''.join(relevant).strip()[:900]
              except Exception:
                  pass

          fields = [
              {'name': '🌿 Rama', 'value': f'\`{ref}\`', 'inline': True},
              {'name': '👤 Autor', 'value': f'\`{actor}\`', 'inline': True},
              {'name': '⚡ Entorno', 'value': '\`Linux Xvfb (E2E)\`', 'inline': True},
              {'name': '📝 Commit', 'value': f'[{short_sha}]({commit_url})', 'inline': True},
              {'name': '🚀 Estado E2E', 'value': f'**{status.upper()}**', 'inline': True},
              {'name': '🧪 Test Suite', 'value': '\`integration_test/app_test.dart\`', 'inline': True},
          ]

          if is_success:
              fields.append({
                  'name': '📊 Resultado E2E',
                  'value': '✅ Flujo de login y navegación E2E completado sin errores.',
                  'inline': False
              })
          else:
              fields.append({
                  'name': '🚨 Falla Detectada en E2E',
                  'value': f'\`\`\`text\n{failure_details or \"Fallo en la ejecución del test runner.\"}\n\`\`\`',
                  'inline': False
              })

          fields.extend([
              {'name': '💬 Mensaje del Commit', 'value': commit_msg[:250] if commit_msg else 'Sin mensaje', 'inline': False},
              {'name': '🔗 Logs & Diagnóstico', 'value': f'[Ver ejecución completa en GitHub Actions]({run_url})', 'inline': False},
          ])

          title = (
              '✅ Flutter CI: Pruebas de Integración E2E Exitosas'
              if is_success else
              '❌ Flutter CI: Falló Prueba de Integración E2E'
          )

          payload = {
              'embeds': [{
                  'title': title,
                  'url': run_url,
                  'description': f'Pruebas de integración de extremo a extremo completadas en **{repo}**.',
                  'color': color,
                  'fields': fields,
                  'footer': {
                      'text': 'Haven CI/CD • Linux Integration Suite',
                      'icon_url': 'https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png'
                  },
                  'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat()
              }]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json', 'User-Agent': 'Haven-CI-Bot'}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f'Notificación enviada a Discord exitosamente: {resp.status}')
          except Exception as e:
              print(f'Error enviando notificación a Discord: {e}')
          "
