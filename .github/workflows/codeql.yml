name: "CodeQL & Dart Security Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '41 11 * * 6'
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. CODEQL OFICIAL (C#, TypeScript, GitHub Actions)
  # ─────────────────────────────────────────────────────────────
  codeql-analysis:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ─────────────────────────────────────────────────────────────
  # 2. ANÁLISIS ESTÁTICO DE DART / FLUTTER (Integrado a GitHub Security)
  # ─────────────────────────────────────────────────────────────
  dart-analysis:
    name: Dart & Flutter Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup configs and env
        run: |
          if [ -n "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_OPTIONS_BASE64 }}" | base64 --decode > lib/firebase_options.dart
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          fi
          if [ -n "${{ secrets.FIREBASE_JSON_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_JSON_BASE64 }}" | base64 --decode > firebase.json
          fi
          if [ ! -f "lib/firebase_options.dart" ]; then
            printf "import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;\n\nclass DefaultFirebaseOptions {\n  static FirebaseOptions get currentPlatform => const FirebaseOptions(\n    apiKey: 'placeholder',\n    appId: 'placeholder',\n    messagingSenderId: 'placeholder',\n    projectId: 'placeholder',\n  );\n}\n" > lib/firebase_options.dart
          fi
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

