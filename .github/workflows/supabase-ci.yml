name: Supabase CI

on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_DB }}

permissions:
  contents: read

jobs:
  test-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
          
      - name: Start Supabase
        run: supabase start
        
      - name: Verify generated types are up-to-date
        run: |
          supabase gen types typescript --local > types.ts
          # Ideally compare types.ts with what's committed, we just ensure it generates correctly here.
          
      - name: DB Linting
        run: supabase db lint

      # Las pruebas corren contra la BD real: la que arman los scripts de supabase/reset,
      # no la de supabase/migrations (desactualizadas respecto a lo que usan los servicios).
      - name: Load real schema (supabase/reset)
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          for script in 01_tirar 02_recrear 03_seed; do
            echo "== $script"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "supabase/reset/$script.sql" > /dev/null
          done

      - name: Run DB Tests
        run: supabase db test

      - name: Notify Discord on Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "✅ **Supabase CI Passed!** Branch: `${{ github.ref_name }}`"}' \
          ${{ env.DISCORD_WEBHOOK_URL }}

      - name: Notify Discord on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "❌ **Supabase CI Failed!** Branch: `${{ github.ref_name }}`"}' \
          ${{ env.DISCORD_WEBHOOK_URL }}
