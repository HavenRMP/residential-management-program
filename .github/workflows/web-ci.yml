name: Web CI

on:
  push:
    paths:
      - 'web/**'
  pull_request:
    paths:
      - 'web/**'

env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_WEB }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        
      - name: Build
        run: npm run build

      - name: Notify Discord on Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "✅ **Web CI Passed!** Branch: `${{ github.ref_name }}`"}' \
          ${{ env.DISCORD_WEBHOOK_URL }}

      - name: Notify Discord on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{"content": "❌ **Web CI Failed!** Branch: `${{ github.ref_name }}`"}' \
          ${{ env.DISCORD_WEBHOOK_URL }}
