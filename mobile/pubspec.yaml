name: haven
description: "Residential Management Program"
publish_to: 'none'
version: 2.1.5+49

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  http: ^1.4.0
  supabase_flutter: ^2.10.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/IMG_4803.png
    - assets/google.svg
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/IMG_4803.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  image_path: "assets/IMG_4803.png"
